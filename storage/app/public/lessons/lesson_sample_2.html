<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Listening Mastery: Maps & Diagrams</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-3xl mx-auto bg-slate-900 rounded-3xl border border-slate-800 shadow-2xl p-6 sm:p-8">
        <div class="flex items-center justify-between border-b border-slate-800 pb-4 mb-6">
            <div>
                <span class="inline-block px-3 py-1 bg-amber-500/20 text-amber-400 text-xs font-bold rounded-full mb-1">IELTS INTENSIVE 7.0+</span>
                <h1 class="text-2xl font-black text-white">Unit 4: Map Labelling Techniques</h1>
            </div>
            <div class="text-right">
                <span class="text-xs text-slate-400 block font-medium">IELTS Score Band</span>
                <span id="score-badge" class="text-lg font-black text-amber-400">Band 8.0</span>
            </div>
        </div>

        <div class="mb-8">
            <h2 class="text-lg font-bold text-slate-200 mb-3">🎧 Listening Practice: Directional Signals</h2>
            <p class="text-sm text-slate-400 mb-4">Click to hear key spatial locators in IELTS Listening Part 2:</p>
            
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <button onclick="speak('Turn left at the main roundabout')" class="p-3 bg-slate-800 hover:bg-slate-700 rounded-xl border border-slate-700 text-left text-xs font-semibold transition-all">
                    "Turn left at roundabout" 🔊
                </button>
                <button onclick="speak('Adjacent to the library entrance')" class="p-3 bg-slate-800 hover:bg-slate-700 rounded-xl border border-slate-700 text-left text-xs font-semibold transition-all">
                    "Adjacent to library" 🔊
                </button>
                <button onclick="speak('Directly opposite the courtyard')" class="p-3 bg-slate-800 hover:bg-slate-700 rounded-xl border border-slate-700 text-left text-xs font-semibold transition-all">
                    "Opposite courtyard" 🔊
                </button>
            </div>
        </div>

        <div class="mb-8">
            <h2 class="text-lg font-bold text-slate-200 mb-3">📝 Map Identification Quiz</h2>
            <div class="bg-slate-800/80 p-5 rounded-2xl border border-slate-700 space-y-3">
                <p class="text-sm font-medium">Where is the Information Desk located according to the audio?</p>
                <button onclick="checkIelts(this, true)" class="w-full text-left p-3 rounded-xl bg-slate-900 border border-slate-700 hover:border-amber-400 text-sm font-medium transition-all">
                    A. Next to the main entrance on your right
                </button>
                <button onclick="checkIelts(this, false)" class="w-full text-left p-3 rounded-xl bg-slate-900 border border-slate-700 hover:border-amber-400 text-sm font-medium transition-all">
                    B. At the end of the corridor on the 2nd floor
                </button>
                <div id="ielts-feedback" class="text-xs font-bold hidden mt-2"></div>
            </div>
        </div>

        <div class="pt-4 border-t border-slate-800 text-center">
            <button onclick="finishLesson()" class="px-8 py-3.5 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black text-sm rounded-2xl shadow-lg shadow-amber-500/20 transition-all hover:scale-105">
                ⚡ Hoàn Thành Bài IELTS & Gửi Kết Quả
            </button>
        </div>
    </div>

    <script>
        function speak(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                speechSynthesis.speak(utterance);
            }
        }

        function checkIelts(btn, isCorrect) {
            const feedback = document.getElementById('ielts-feedback');
            feedback.classList.remove('hidden', 'text-emerald-400', 'text-rose-400');
            if (isCorrect) {
                btn.classList.add('bg-emerald-950', 'border-emerald-500');
                feedback.classList.add('text-emerald-400');
                feedback.innerText = '✅ Chính xác! Band 8.5 Listening Skill!';
            } else {
                btn.classList.add('bg-rose-950', 'border-rose-500');
                feedback.classList.add('text-rose-400');
                feedback.innerText = '❌ Sai rồi, đáp án đúng là A.';
            }
        }

        function finishLesson() {
            window.parent.postMessage({
                type: 'LESSON_COMPLETED',
                score: 100,
                status: 'completed'
            }, '*');
            alert('Đã lưu bài học IELTS Listening!');
        }
    </script>
</body>
</html>
